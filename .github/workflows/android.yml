name: Android Release APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-prod-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Secrets (Keystore & local.properties)
      env:
        KEYSTORE_DATA: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
        echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}" >> local.properties

        if [ -n "$KEYSTORE_DATA" ] && [ -n "$KEY_ALIAS" ]; then
          echo "$KEYSTORE_DATA" | base64 -d > brukchord-release.jks
          {
            echo "storeFile=brukchord-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
        else
          echo "No release keystore secret configured; generating signing keystore."
          keytool -genkeypair -v -keystore brukchord-release.jks -alias brukchord \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=BrukChord, OU=BrukChord, O=BrukChord, L=Unknown, ST=Unknown, C=US"
          {
            echo "storeFile=brukchord-release.jks"
            echo "storePassword=android"
            echo "keyAlias=brukchord"
            echo "keyPassword=android"
          } > keystore.properties
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Signed Prod Release APK
      run: ./gradlew assembleProdRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: brukchord-prod-release-signed
        path: app/build/outputs/apk/prod/release/*.apk

    - name: Upload Wear OS APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: brukchord-wear-prod-release-signed
        path: wearos/build/outputs/apk/prod/release/*.apk

    - name: Upload TV APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: brukchord-tv-prod-release-signed
        path: tv/build/outputs/apk/prod/release/*.apk

    - name: Prepare Release Assets
      id: prepare_release
      run: |
        VERSION=$(grep 'extra\["bitchordVersionName"\]' build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
        if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          TAG_NAME="${{ github.ref_name }}"
        else
          TAG_NAME="v${VERSION}"
        fi
        echo "VERSION=${VERSION}" >> $GITHUB_ENV
        echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV

        mkdir -p release-assets
        for apk in app/build/outputs/apk/prod/release/*.apk; do
          [ -e "$apk" ] || continue
          filename=$(basename "$apk")
          if [[ "$filename" == *"universal"* ]]; then
            cp "$apk" "release-assets/BrukChord-v${VERSION}.apk"
          elif [[ "$filename" == *"arm64-v8a"* ]]; then
            cp "$apk" "release-assets/BrukChord-v${VERSION}_arm64-v8a.apk"
          elif [[ "$filename" == *"armeabi-v7a"* ]]; then
            cp "$apk" "release-assets/BrukChord-v${VERSION}_armeabi-v7a.apk"
          elif [[ "$filename" == *"x86_64"* ]]; then
            cp "$apk" "release-assets/BrukChord-v${VERSION}_x86_64.apk"
          else
            cp "$apk" "release-assets/${filename}"
          fi
        done

        for apk in wearos/build/outputs/apk/prod/release/*.apk; do
          if [ -f "$apk" ]; then
            cp "$apk" "release-assets/BrukChordWear-v${VERSION}.apk"
          fi
        done

        for apk in tv/build/outputs/apk/prod/release/*.apk; do
          [ -e "$apk" ] || continue
          filename=$(basename "$apk")
          if [[ "$filename" == *"universal"* ]]; then
            cp "$apk" "release-assets/BrukChordTV-v${VERSION}.apk"
          elif [[ "$filename" == *"arm64-v8a"* ]]; then
            cp "$apk" "release-assets/BrukChordTV-v${VERSION}_arm64-v8a.apk"
          elif [[ "$filename" == *"armeabi-v7a"* ]]; then
            cp "$apk" "release-assets/BrukChordTV-v${VERSION}_armeabi-v7a.apk"
          elif [[ "$filename" == *"x86_64"* ]]; then
            cp "$apk" "release-assets/BrukChordTV-v${VERSION}_x86_64.apk"
          else
            cp "$apk" "release-assets/${filename}"
          fi
        done

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.TAG_NAME }}
        name: BrukChord ${{ env.TAG_NAME }}
        generate_release_notes: true
        files: release-assets/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
